name: Web export

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip -d godot-bin
          sudo mv godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d templates
          mv templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: godot --headless --path . --import

      - name: Run tests
        run: godot --headless --path . -s tests/test_runner.gd

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -f build/web/index.html

      - name: Pack release archive
        run: (cd build/web && zip -r ../../memory-web.zip .)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - uses: actions/upload-artifact@v4
        with:
          name: memory-web
          path: memory-web.zip

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: memory-web
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" memory-web.zip \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
